name: CI

on:
  push:
    branches: [main]
    paths: ['platform/**', '.github/workflows/**']
  pull_request:
    branches: [main]
    paths: ['platform/**', '.github/workflows/**']

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
